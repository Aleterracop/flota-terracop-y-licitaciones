<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Flota y Licitaciones - Terracop</title>
    <!-- Tailwind CSS y SheetJS para leer Excel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-gray-800 p-4 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-emerald-400">Flota Terracop y Licitaciones</h1>
            <div>
                <label class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg cursor-pointer font-semibold shadow transition inline-block">
                    📂 Subir Nuevo Excel
                    <input type="file" id="excelFile" class="hidden" accept=".xlsx, .xls">
                </label>
            </div>
        </header>

        <div id="statusMessage" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- Contenedor principal de datos -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-5 rounded-xl shadow border border-gray-700">
                <p class="text-gray-400 text-sm">Equipos Totales</p>
                <p id="totalEquipos" class="text-3xl font-bold text-white mt-1">0</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl shadow border border-gray-700">
                <p class="text-gray-400 text-sm">Disponibles</p>
                <p id="totalDisponibles" class="text-3xl font-bold text-emerald-400 mt-1">0</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl shadow border border-gray-700">
                <p class="text-gray-400 text-sm">En Taller / Mantención</p>
                <p id="totalTaller" class="text-3xl font-bold text-amber-400 mt-1">0</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl shadow overflow-hidden border border-gray-700">
            <div class="p-4 border-b border-gray-700 font-semibold text-gray-300">Detalle de la Flota</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tablaFlota">
                    <thead class="bg-gray-700 text-gray-300 text-xs uppercase">
                        <tr>
                            <th class="p-3">Equipo</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Ubicación / Faena</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700 text-sm">
                        <tr><td colspan="3" class="p-4 text-center text-gray-400">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Carga inicial automática buscando el archivo en el repositorio
        async function cargarDatosIniciales() {
            try {
                let respuesta = await fetch('flota.xlsx?t=' + Date.now());
                if (!respuesta.ok) throw new Error("No se encontró el archivo.");
                let blob = await respuesta.blob();
                procesarArchivo(blob);
            } catch (error) {
                mostrarMensaje("Sube o actualiza tu archivo 'flota.xlsx' para ver los datos.", "bg-amber-600 text-white");
            }
        }

        // Permitir actualizar desde el botón de la página de forma local y limpia
        document.getElementById('excelFile').addEventListener('change', function(e) {
            let archivo = e.target.files[0];
            if (!archivo) return;
            procesarArchivo(archivo);
            mostrarMensaje("Datos actualizados en pantalla correctamente.", "bg-emerald-600 text-white");
        });

        function procesarArchivo(blob) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let firstSheet = workbook.SheetNames[0];
                let jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                renderizarTabla(jsonData);
            };
            reader.readAsArrayBuffer(blob);
        }

        function renderizarTabla(data) {
            let tbody = document.querySelector("#tablaFlota tbody");
            tbody.innerHTML = "";
            let disponibles = 0;
            let taller = 0;

            data.forEach(row => {
                let tr = document.createElement("tr");
                let equipo = row['Equipo'] || row['EQUIPO'] || row['Nombre'] || Object.values(row)[0] || '-';
                let estado = row['Estado'] || row['ESTADO'] || Object.values(row)[1] || '-';
                let ubicacion = row['Ubicación'] || row['UBICACION'] || row['Faena'] || Object.values(row)[2] || '-';

                if (String(estado).toLowerCase().includes('disponible')) disponibles++;
                if (String(estado).toLowerCase().includes('taller') || String(estado).toLowerCase().includes('mant')) taller++;

                tr.innerHTML = `<td class="p-3 font-medium">${equipo}</td><td class="p-3">${estado}</td><td class="p-3 text-gray-400">${ubicacion}</td>`;
                tbody.appendChild(tr);
            });

            document.getElementById("totalEquipos").innerText = data.length;
            document.getElementById("totalDisponibles").innerText = disponibles;
            document.getElementById("totalTaller").innerText = taller;
        }

        function mostrarMensaje(texto, clases) {
            let msg = document.getElementById("statusMessage");
            msg.className = "mb-4 p-3 rounded-lg text-sm text-center " + clases;
            msg.innerText = texto;
            msg.classList.remove("hidden");
            setTimeout(() => msg.classList.add("hidden"), 5000);
        }

        cargarDatosIniciales();
    </script>
</body>
</html>
