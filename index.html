<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">

  <style>
    :root {
      --bg-main: #0b1329;
      --bg-card: #152238;
      --bg-card-hover: #1c2d4a;
      --bg-surface: #0f1c32;
      --border-color: #243859;
      --border-light: #334e77;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 12px; }
    .app-container { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 14px; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #182640 0%, #0d1728 100%); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); flex-wrap: wrap; gap: 12px; }
    .brand-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand-logo-card { background: #ffffff; padding: 6px 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.2); }
    .brand-logo-card svg { height: 42px; width: auto; display: block; }
    .header-title-box { display: flex; flex-direction: column; }
    .header-title { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8px; color: #ffffff; }
    .header-sub { font-size: 11px; color: #38bdf8; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.12); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.25); }
    .sync-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 650px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card { background: var(--bg-card); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s; }
    .kpi-card:hover, .kpi-card.active { transform: translateY(-2px); border-color: var(--border-light); background: var(--bg-card-hover); }
    .kpi-card.active { box-shadow: 0 0 0 2px var(--accent-blue); }
    .kpi-icon-wrap { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .kpi-op { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .kpi-disp { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .kpi-tall { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .kpi-fs { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .kpi-info { display: flex; flex-direction: column; }
    .kpi-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-size: 20px; font-weight: 900; line-height: 1.2; }
    .filters-section { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .filters-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 650px) { .filters-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .custom-select, .search-input { background-color: #121e33; border: 1px solid var(--border-color); color: #e2e8f0; font-size: 13px; font-weight: 500; border-radius: 8px; padding: 9px 12px; outline: none; width: 100%; }
    .custom-select:focus, .search-input:focus { border-color: var(--accent-blue); }
    .filter-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
    .btn-reset { background: #1e3a8a; color: white; font-weight: 700; font-size: 12px; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .results-count { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .cards-container { display: flex; flex-direction: column; gap: 10px; }
    .equipo-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .equipo-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); }
    .card-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .unit-identity { display: flex; align-items: center; gap: 8px; }
    .unit-badge { background: #0f172a; border: 1px solid var(--border-light); color: #38bdf8; font-weight: 800; font-size: 11.5px; padding: 4px 8px; border-radius: 6px; }
    .unit-patente { font-weight: 800; font-size: 15px; color: #ffffff; }
    .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }
    .badge-op { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-disp { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-tall { background: rgba(245, 158, 11, 0.18); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-fs { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .card-body-grid { display: grid; grid-template-columns: 1fr; gap: 8px; font-size: 12.5px; background: rgba(15, 23, 42, 0.4); padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); }
    @media (min-width: 650px) { .card-body-grid { grid-template-columns: repeat(3, 1fr); } }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
    .meta-val { color: #cbd5e1; font-weight: 500; }
    .meta-val.highlight { color: #38bdf8; font-weight: 600; }
    .card-footer-alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; padding-top: 6px; border-top: 1px dashed var(--border-color); color: var(--text-muted); }
    .alert-tag { font-weight: 800; padding: 3px 9px; border-radius: 5px; font-size: 11px; }
    .alert-warn { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .alert-ok { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .no-results { text-align: center; padding: 40px 20px; color: var(--text-dim); background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border-color); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(4, 9, 20, 0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-container { background: #152238; border: 1px solid var(--border-light); border-radius: 16px; width: 100%; max-width: 580px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #182640; padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .btn-close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto; }
    .modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: rgba(11, 19, 41, 0.6); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; }
    .modal-section-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: -4px; }
    .taller-box { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>

        <div class="kpi-info"><span class="kpi-label">En Operación</span><span class="kpi-value" id="count-op">0</span></div>

      <div class="kpi-card" id="kpi-disp" onclick="filterFlotaByState('DISPONIBLE')">
        <div class="kpi-icon-wrap kpi-disp">✅</div>
        <div class="kpi-info"><span class="kpi-label">Disponibles</span><span class="kpi-value" id="count-disp">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-tall" onclick="filterFlotaByState('EN TALLER')">
        <div class="kpi-icon-wrap kpi-tall">🛠️</div>
        <div class="kpi-info"><span class="kpi-label">En Taller / Mant.</span><span class="kpi-value" id="count-tall">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-fs" onclick="filterFlotaByState('FUERA DE SERVICIO')">
        <div class="kpi-icon-wrap kpi-fs">⛔</div>
        <div class="kpi-info"><span class="kpi-label">Fuera Servicio</span><span class="kpi-value" id="count-fs">0</span></div>
      </div>

    <section class="filters-section">

        <div class="filter-group">

          <select id="mandanteSelectFlota" class="custom-select" onchange="applyFlotaFilters()"><option value="TODOS">Todas las faenas / bases</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn-reset" onclick="resetFlotaFilters()">🔄 Limpiar Filtros</button>
        <span class="results-count" id="resultsCountFlota">Cargando unidades...</span>
      </div>
    </section>

    <main class="cards-container" id="equiposList"></main>
  </div>

        var p0 = parseInt(parts[0], 10);
        var p1 = parseInt(parts[1], 10);
        var p2 = parseInt(parts[2], 10);
        if (p0 > 1000) return new Date(p0, p1 - 1, p2);
        var year = p2 < 100 ? p2 + 2000 : p2;
        return new Date(year, p1 - 1, p0);
      }
      var parsed = new Date(s);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatExcelDate(val) {
      var d = parseDateObj(val);
      if (!d) return val ? String(val) : '';
      var dia = ('0' + d.getDate()).slice(-2);
      var mes = ('0' + (d.getMonth() + 1)).slice(-2);
      var anio = d.getFullYear();
      return dia + '/' + mes + '/' + anio;
    }

    function calcularAtrasoTaller(fCompromiso, fSalidaReal) {
      var dComp = parseDateObj(fCompromiso);
      if (!dComp) return { texto: '', atrasado: false, diffDays: 0 };
      var dFin = parseDateObj(fSalidaReal) || new Date();
      var tComp = new Date(dComp.getFullYear(), dComp.getMonth(), dComp.getDate()).getTime();
      var tFin = new Date(dFin.getFullYear(), dFin.getMonth(), dFin.getDate()).getTime();
      var diffDays = Math.round((tFin - tComp) / (1000 * 60 * 60 * 24));
      if (diffDays > 0) {
        return { texto: '🔴 Atrasado (+' + diffDays + ' d)', atrasado: true, diffDays: diffDays };
      } else if (diffDays === 0) {
        return { texto: '🟡 Vence Hoy', atrasado: false, diffDays: 0 };
      } else {
        return { texto: '🟢 En Plazo (' + Math.abs(diffDays) + ' d rest.)', atrasado: false, diffDays: diffDays };
      }
    }

    function setLastModifiedDisplay(dateObj, prefix) {
      var dia = ('0' + dateObj.getDate()).slice(-2);
      var mes = ('0' + (dateObj.getMonth() + 1)).slice(-2);
      var anio = dateObj.getFullYear();
      var hora = ('0' + dateObj.getHours()).slice(-2);
      var min = ('0' + dateObj.getMinutes()).slice(-2);
      var seg = ('0' + dateObj.getSeconds()).slice(-2);
      var formatted = dia + '/' + mes + '/' + anio + ' ' + hora + ':' + min + ':' + seg + ' hrs';
      var el = document.getElementById('last-update-display');
      if (el) {
        el.innerHTML = '&#128336; ' + (prefix || 'Modificado:') + '<br><strong style="color:#e2e8f0">' + formatted + '</strong>';
      }
      localStorage.setItem('terracop_last_update', formatted);
      localStorage.setItem('terracop_last_prefix', prefix || 'Modificado:');
    }

    function syncLiveExcel() {
      if (!LIVE_EXCEL_URL) return;
      fetch(LIVE_EXCEL_URL + '?nocache=' + new Date().getTime())
        .then(res => {
          if (!res.ok) throw new Error('No disponible');
          var lastMod = res.headers.get('Last-Modified');
          var d = lastMod ? new Date(lastMod) : new Date();
          return res.arrayBuffer().then(buf => ({ buffer: buf, date: d }));
        })
        .then(resData => {
          const workbook = XLSX.read(new Uint8Array(resData.buffer), { type: 'array' });
          const sheetFlota = workbook.SheetNames.find(s => s.toLowerCase().includes('flota') || s.toLowerCase().includes('taller')) || workbook.SheetNames[2] || workbook.SheetNames[0];
          if (sheetFlota) {
            parseAndLoadSheet(workbook.Sheets[sheetFlota]);
            setLastModifiedDisplay(resData.date, 'Actualizado en vivo:');
          }
        })
        .catch(e => console.log('Usando base local.'));
    }

    function parseAndLoadSheet(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let newFlota = [];
      for (let i = 4; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length === 0) continue;
        let item = r[0], cod = r[1] ? String(r[1]).trim() : '', patente = r[2] ? String(r[2]).trim() : '', tipo = r[3] ? String(r[3]).trim() : '';
        let modelo = r[4] ? String(r[4]).trim() : '', ubicacion = r[5] ? String(r[5]).trim() : '', estado_check = r[6] ? String(r[6]).trim() : '🟢 DISPONIBLE INMEDIATO';
        let mandante = r[7] ? String(r[7]).trim() : '';
        let f_entrada = formatExcelDate(r[8]);
        let f_salida = formatExcelDate(r[9]);
        let f_salida_real = formatExcelDate(r[10]);
        let checkAtraso = calcularAtrasoTaller(r[9], r[10]);
        let cumplimiento = checkAtraso.texto || (r[11] ? String(r[11]).trim() : '');
        let alerta = r[12] ? String(r[12]).trim() : '';
        if (!tipo && !patente && !cod) continue;
        let estado_cat = "DISPONIBLE";
        let estUpper = estado_check.toUpperCase();
        if (estUpper.includes('EN USO') || estUpper.includes('OPERACIÓN') || estUpper.includes('OPERACION')) estado_cat = "EN OPERACIÓN";
        else if (estUpper.includes('TALLER') || estUpper.includes('MANTENCIÓN') || estUpper.includes('MANTENCION')) estado_cat = "EN TALLER";
        else if (estUpper.includes('FUERA') || estUpper.includes('NO OPERATIVO')) estado_cat = "FUERA DE SERVICIO";

        newFlota.push({
          item: item || (newFlota.length + 1), cod: cod, patente: patente, tipo: tipo, modelo: modelo,
          ubicacion: ubicacion, estado: estado_check, estado_cat: estado_cat, mandante: mandante || ubicacion,
          f_entrada: f_entrada, f_salida_comp: f_salida, f_salida_real: f_salida_real, cumplimiento: cumplimiento, alerta: alerta
        });
      }
      if (newFlota.length > 0) {
        DATA_FLOTA = newFlota;
        initFlota();
      }
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      var fileModDate = file.lastModified ? new Date(file.lastModified) : new Date();
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetFlota = workbook.SheetNames.find(s => s.toLowerCase().includes('flota') || s.toLowerCase().includes('taller')) || workbook.SheetNames[2] || workbook.SheetNames[0];
          if (sheetFlota) {
            parseAndLoadSheet(workbook.Sheets[sheetFlota]);
            setLastModifiedDisplay(fileModDate, 'Archivo modificado:');
          }

          alert("⏳ Subiendo Excel a la nube de GitHub...");
          let binary = '';
          let bytes = new Uint8Array(e.target.result);
          for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
          let base64Content = window.btoa(binary);

          fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + encodeURIComponent(GH_FILE_PATH), {
            headers: { 'Authorization': 'token ' + GH_TOKEN }
          })
          .then(response => response.json())
          .then(fileData => {
            let sha = fileData.sha;
            return fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + encodeURIComponent(GH_FILE_PATH), {
              method: 'PUT',
              headers: { 'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'Actualizacion automatica de flota', content: base64Content, sha: sha })
            });
          })
          .then(res => {
            if (res.ok) {
              alert("✅ ¡Sincronizado con éxito en la nube para todos!");
            } else {
              alert("⚠️ Datos cargados en pantalla, revisa la conexión con GitHub.");
            }
          })
          .catch(err => { console.error(err); });

        } catch (err) {
          alert("Error al procesar el Excel.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    let currentFilterFlotaState = 'TODOS';

    function initFlota() {
      var tipos = [];
      var mandantes = [];
      for (var i = 0; i < DATA_FLOTA.length; i++) {
        var t = DATA_FLOTA[i].tipo;
        var m = DATA_FLOTA[i].mandante || DATA_FLOTA[i].ubicacion;
        if (t && tipos.indexOf(t) === -1) tipos.push(t);
        if (m && mandantes.indexOf(m) === -1) mandantes.push(m);
      }
      tipos.sort(); mandantes.sort();

      var tipoSelect = document.getElementById('tipoSelect');
      tipoSelect.innerHTML = '<option value="TODOS">Todos los tipos</option>';
      for (var j = 0; j < tipos.length; j++) {
        var optT = document.createElement('option'); optT.value = tipos[j]; optT.textContent = tipos[j]; tipoSelect.appendChild(optT);
      }

      var mandanteSelect = document.getElementById('mandanteSelectFlota');
      mandanteSelect.innerHTML = '<option value="TODOS">Todas las faenas / bases</option>';
      for (var k = 0; k < mandantes.length; k++) {
        var optM = document.createElement('option'); optM.value = mandantes[k]; optM.textContent = mandantes[k]; mandanteSelect.appendChild(optM);
      }

      calculateFlotaKPIs();
      applyFlotaFilters();
    }

    function calculateFlotaKPIs() {
      var op = 0, disp = 0, tall = 0, fs = 0;
      for (var i = 0; i < DATA_FLOTA.length; i++) {
        var cat = DATA_FLOTA[i].estado_cat;
        if (cat === 'EN OPERACIÓN') op++;
        else if (cat === 'DISPONIBLE') disp++;
        else if (cat === 'EN TALLER') tall++;
        else if (cat === 'FUERA DE SERVICIO') fs++;
      }
      document.getElementById('count-op').textContent = op;
      document.getElementById('count-disp').textContent = disp;
      document.getElementById('count-tall').textContent = tall;
      document.getElementById('count-fs').textContent = fs;
    }

    function filterFlotaByState(state) {
      if (currentFilterFlotaState === state) {
        currentFilterFlotaState = 'TODOS';
        clearFlotaKpiActive();
      } else {
        currentFilterFlotaState = state;
        clearFlotaKpiActive();
        if (state === 'EN OPERACIÓN') document.getElementById('kpi-op').classList.add('active');
        if (state === 'DISPONIBLE') document.getElementById('kpi-disp').classList.add('active');
        if (state === 'EN TALLER') document.getElementById('kpi-tall').classList.add('active');
        if (state === 'FUERA DE SERVICIO') document.getElementById('kpi-fs').classList.add('active');
      }
      applyFlotaFilters();
    }

    function clearFlotaKpiActive() {
      var cards = document.querySelectorAll('.kpi-card');
      for (var i = 0; i < cards.length; i++) { cards[i].classList.remove('active'); }
    }

    function resetFlotaFilters() {
      document.getElementById('searchInputFlota').value = '';
      document.getElementById('tipoSelect').value = 'TODOS';
      document.getElementById('mandanteSelectFlota').value = 'TODOS';
      currentFilterFlotaState = 'TODOS';
      clearFlotaKpiActive();
      applyFlotaFilters();
    }

    function applyFlotaFilters() {
      var search = document.getElementById('searchInputFlota').value.toLowerCase().trim();
      var tipo = document.getElementById('tipoSelect').value;
      var mandante = document.getElementById('mandanteSelectFlota').value;

      var filtered = [];
      for (var i = 0; i < DATA_FLOTA.length; i++) {
        var item = DATA_FLOTA[i];
        var matchesSearch = !search || 
          (item.patente && item.patente.toLowerCase().indexOf(search) !== -1) ||
          (item.cod && item.cod.toLowerCase().indexOf(search) !== -1) ||
          (item.modelo && item.modelo.toLowerCase().indexOf(search) !== -1) ||
          (item.tipo && item.tipo.toLowerCase().indexOf(search) !== -1);

        var matchesTipo = (tipo === 'TODOS' || item.tipo === tipo);
        var matchesMandante = (mandante === 'TODOS' || item.mandante === mandante || item.ubicacion === mandante);
        var matchesState = (currentFilterFlotaState === 'TODOS' || item.estado_cat === currentFilterFlotaState);

        if (matchesSearch && matchesTipo && matchesMandante && matchesState) { filtered.push(item); }
      }
      renderFlotaList(filtered);
    }

    function renderFlotaList(list) {
      var container = document.getElementById('equiposList');
      var countSpan = document.getElementById('resultsCountFlota');
      countSpan.textContent = 'Mostrando ' + list.length + ' de ' + DATA_FLOTA.length + ' unidades';

      if (list.length === 0) {
        container.innerHTML = '<div class="no-results"><p>🔍 No se encontraron equipos con los filtros seleccionados.</p></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var badgeClass = 'badge-disp';
        var icon = '🟢';
        if (item.estado_cat === 'EN OPERACIÓN') { badgeClass = 'badge-op'; icon = '🔵'; }
        else if (item.estado_cat === 'EN TALLER') { badgeClass = 'badge-tall'; icon = '🟡'; }
        else if (item.estado_cat === 'FUERA DE SERVICIO') { badgeClass = 'badge-fs'; icon = '🔴'; }

        var checkAtraso = calcularAtrasoTaller(item.f_salida_comp, item.f_salida_real);
        var textoCump = checkAtraso.texto || item.cumplimiento;
        var esAtrasado = checkAtraso.atrasado || (textoCump && textoCump.toLowerCase().includes('atrasado'));

        var alertaTag = '';
        if (textoCump) {
          var warnClass = esAtrasado ? 'alert-warn' : 'alert-ok';
          alertaTag = '<span class="alert-tag ' + warnClass + '">' + textoCump + '</span>';
        }

        var controlTallerHtml = '<span style="color:var(--text-dim)">Sin Registro</span>';
        if (item.f_salida_comp || item.f_entrada) {
          controlTallerHtml = '<div style="display:flex; flex-direction:column; gap:2px;">' +
            (item.f_entrada ? '<span><strong>Ingreso:</strong> ' + item.f_entrada + '</span>' : '') +
            (item.f_salida_comp ? '<span style="color:#fde68a;"><strong>Compromiso:</strong> ' + item.f_salida_comp + '</span>' : '') +
          '</div>';
        }

        var alertaFooter = '';
        if (item.alerta || textoCump) {
          alertaFooter = '<div class="card-footer-alert"><span><strong>Estado:</strong> ' + (item.alerta || 'En seguimiento') + '</span>' + alertaTag + '</div>';
        }

        var cleanEstado = item.estado ? item.estado.replace(/^[🔴🔵🟡🟢]\s*/, '') : '';

        html += '<div class="equipo-card" onclick="openEquipoModal(' + item.item + ')">' +
          '<div class="card-top-row">' +
            '<div class="unit-identity"><span class="unit-badge">' + (item.cod || 'EQ') + '</span><span class="unit-patente">' + (item.patente || 'SIN PLACA') + '</span><span style="font-size:12px; color:var(--text-dim)">•</span><span style="font-size:12.5px; font-weight:600; color:#e2e8f0;">' + item.tipo + '</span></div>' +
            '<div class="status-badge ' + badgeClass + '">' + icon + ' ' + cleanEstado + '</div>' +
          '</div>' +
          '<div class="card-body-grid">' +
            '<div class="meta-item"><span class="meta-label">Modelo</span><span class="meta-val">' + (item.modelo || '-') + '</span></div>' +
            '<div class="meta-item"><span class="meta-label">Ubicación / Faena</span><span class="meta-val highlight">' + (item.mandante || item.ubicacion || 'Base') + '</span></div>' +
            '<div class="meta-item"><span class="meta-label">Control Taller</span><span class="meta-val">' + controlTallerHtml + '</span></div>' +
          '</div>' +
          alertaFooter +
        '</div>';
      }
      container.innerHTML = html;
    }

    function openEquipoModal(itemNum) {
      var item = DATA_FLOTA.find(function(e) { return e.item === itemNum; });
      if (!item) return;

      var checkAtraso = calcularAtrasoTaller(item.f_salida_comp, item.f_salida_real);
      var textoCump = checkAtraso.texto || item.cumplimiento || 'Sin registro';
      var esAtrasado = checkAtraso.atrasado || (textoCump && textoCump.toLowerCase().includes('atrasado'));

      var badgeClass = 'badge-disp';
      if (item.estado_cat === 'EN OPERACIÓN') badgeClass = 'badge-op';
      else if (item.estado_cat === 'EN TALLER') badgeClass = 'badge-tall';
      else if (item.estado_cat === 'FUERA DE SERVICIO') badgeClass = 'badge-fs';

      var cleanEstado = item.estado ? item.estado.replace(/^[🔴🔵🟡🟢]\s*/, '') : 'En Registro';

      document.getElementById('modalHeaderTitle').innerHTML = '<span class="unit-badge">' + (item.cod || 'EQ') + '</span><span>' + (item.patente || 'SIN PLACA') + ' - ' + item.tipo + '</span>';

      var modalHtml = 
        '<span class="modal-section-title">📌 Identificación y Asignación</span>' +
        '<div class="modal-grid">' +
          '<div class="meta-item"><span class="meta-label">Código</span><span class="meta-val highlight">' + (item.cod || '-') + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Patente</span><span class="meta-val" style="font-weight:700; color:#fff;">' + (item.patente || 'SIN PLACA') + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Tipo</span><span class="meta-val">' + (item.tipo || '-') + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Modelo</span><span class="meta-val">' + (item.modelo || '-') + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Ubicación</span><span class="meta-val">' + (item.ubicacion || 'Base') + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Mandante</span><span class="meta-val highlight">' + (item.mandante || '-') + '</span></div>' +
        '</div>' +
        '<span class="modal-section-title">🚦 Estado Operacional</span>' +
        '<div style="display:flex; align-items:center; justify-content:space-between; background:rgba(11, 19, 41, 0.6); padding:12px; border-radius:10px; border:1px solid var(--border-color);">' +
          '<span style="font-size:12px; color:var(--text-muted); font-weight:600;">Disponibilidad:</span>' +
          '<span class="status-badge ' + badgeClass + '">' + cleanEstado + '</span>' +
        '</div>' +
        '<span class="modal-section-title">🛠️ Control Taller</span>' +
        '<div class="taller-box">' +
          '<div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;">' +
            '<div class="meta-item"><span class="meta-label">Ingreso</span><span class="meta-val" style="font-weight:700;">' + (item.f_entrada || 'Sin registro') + '</span></div>' +
            '<div class="meta-item"><span class="meta-label">Compromiso</span><span class="meta-val" style="font-weight:700; color:#fde68a;">' + (item.f_salida_comp || 'Sin registro') + '</span></div>' +
          '</div>' +
          '<div style="display:flex; align-items:center; justify-content:space-between; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1);">' +
            '<span style="font-size:12px; color:var(--text-muted); font-weight:600;">Cumplimiento:</span>' +
            '<span class="alert-tag ' + (esAtrasado ? 'alert-warn' : 'alert-ok') + '">' + textoCump + '</span>' +
          '</div>' +
        '</div>';

      document.getElementById('modalBodyContent').innerHTML = modalHtml;
      document.getElementById('equipoModal').classList.add('active');
    }

    function closeModal(e) { if (e.target.id === 'equipoModal') document.getElementById('equipoModal').classList.remove('active'); }
    function closeModalDirect() { document.getElementById('equipoModal').classList.remove('active'); }

    window.addEventListener('DOMContentLoaded', function() {
      initFlota();
      syncLiveExcel();
      var saved = localStorage.getItem('terracop_last_update');
      var prefix = localStorage.getItem('terracop_last_prefix') || 'Última mod:';
      var el = document.getElementById('last-update-display');
      if (saved && el) { el.innerHTML = '&#128336; ' + prefix + '<br><strong style="color:#e2e8f0">' + saved + '</strong>'; }
    });
  </script>
</body>
</html>
